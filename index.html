<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>🌤 Weather Dashboard</h1>

        <p>Check the current weather of any city</p>

    </header>


    <!-- Main Container -->
    <main>

        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </section>


        <!-- Error Message -->
        <p id="errorMessage"></p>


        <!-- Weather Card -->
        <section id="weatherCard" class="weather-card">

            <h2 id="cityName">Search for a city</h2>

            <div class="weather-icon" id="weatherIcon">
                🌍
            </div>

            <h3 id="temperature">-- °C</h3>

            <p id="condition">Weather condition</p>

            <div class="weather-details">

                <div>
                    <strong>💧 Humidity</strong>
                    <p id="humidity">-- %</p>
                </div>

                <div>
                    <strong>💨 Wind Speed</strong>
                    <p id="windSpeed">-- km/h</p>
                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>Weather Dashboard | Built using HTML, CSS & JavaScript</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
